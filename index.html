
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixana - Clean Document HTML</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; }
        .code-font { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Strict Semantic Styling for Visual Editor */
        .visual-editor-container {
            line-height: 1.6;
            color: #334155;
        }
        /* Reset all inherited styles inside the editor to ensure a clean look */
        .visual-editor-container * {
            all: revert;
            font-family: 'Inter', sans-serif;
        }
        .visual-editor-container h1 { font-size: 2em; font-weight: 800; margin: 0.67em 0; color: #0f172a; }
        .visual-editor-container h2 { font-size: 1.5em; font-weight: 700; margin: 0.75em 0; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.2rem; }
        .visual-editor-container h3 { font-size: 1.17em; font-weight: 700; margin: 0.83em 0; color: #334155; }
        .visual-editor-container h4 { font-size: 1em; font-weight: 700; margin: 1.12em 0; color: #475569; }
        .visual-editor-container p { margin: 1em 0; }
        .visual-editor-container ul { list-style-type: disc; margin: 1em 0 1em 2em; }
        .visual-editor-container ol { list-style-type: decimal; margin: 1em 0 1em 2em; }
        .visual-editor-container li { margin: 0.25em 0; }
        .visual-editor-container table { 
            border-collapse: collapse; 
            width: 100%; 
            margin: 1em 0; 
            border: 1px solid #cbd5e1; 
        }
        .visual-editor-container th, .visual-editor-container td { 
            border: 1px solid #cbd5e1; 
            padding: 8px 12px; 
            text-align: left; 
        }
        .visual-editor-container th { background: #f8fafc; font-weight: 700; }
        
        /* Placeholder styling */
        .visual-editor-container:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3",
    "vite": "https://esm.sh/vite@^7.3.1"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
</body>
</html>
