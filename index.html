<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixana - Clean Document HTML</title>
    <!-- Tailwind CSS Play CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✨</text></svg>">
    <style>
        body { font-family: 'Inter', sans-serif; overflow: hidden; height: 100vh; margin: 0; }
        .code-font { font-family: 'Fira Code', monospace; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* Visual Editor Styling */
        .visual-editor-container {
            line-height: 1.6;
            color: #334155;
            outline: none;
        }
        .visual-editor-container h1 { font-size: 2.25rem; font-weight: 800; margin-bottom: 1rem; color: #0f172a; }
        .visual-editor-container h2 { font-size: 1.875rem; font-weight: 700; margin-top: 2rem; margin-bottom: 0.75rem; color: #1e293b; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.5rem; }
        .visual-editor-container h3 { font-size: 1.5rem; font-weight: 700; margin-top: 1.5rem; margin-bottom: 0.5rem; color: #334155; }
        .visual-editor-container p { margin-bottom: 1rem; }
        .visual-editor-container ul { list-style-type: disc; margin: 1rem 0 1rem 2rem; }
        .visual-editor-container ol { list-style-type: decimal; margin: 1rem 0 1rem 2rem; }
        .visual-editor-container li { margin-bottom: 0.25rem; }
        .visual-editor-container table { border-collapse: collapse; width: 100%; margin: 1.5rem 0; border: 1px solid #cbd5e1; }
        .visual-editor-container th, .visual-editor-container td { border: 1px solid #cbd5e1; padding: 12px; text-align: left; }
        .visual-editor-container th { background: #f8fafc; font-weight: 700; }
        .visual-editor-container strong { font-weight: 700; color: #0f172a; }
        .visual-editor-container a { color: #2563eb; text-decoration: underline; }
        
        .visual-editor-container:empty:before {
            content: attr(data-placeholder);
            color: #94a3b8;
            pointer-events: none;
            display: block;
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "react/": "https://esm.sh/react@^19.2.4/",
    "vite": "https://esm.sh/vite@^7.3.1",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.3"
  }
}
</script>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>
    <script type="module" src="./index.tsx"></script>
</body>
</html>
